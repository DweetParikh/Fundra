[toolchain]
anchor_version = "0.31.1"

[features]
resolution = false
skip-lint = false

[programs.localnet]
fundra = "Gi3TATmmgMsCAZadWqHBa8sJw6YxHa9fuYaQHcK4Ks8D"

[programs.devnet]
fundra = "Gi3TATmmgMsCAZadWqHBa8sJw6YxHa9fuYaQHcK4Ks8D"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/fundra.ts"

[test]
startup_wait = 20000

# Metaplex Core is not part of the default local validator; load the program binary so
# receipt NFT minting works in tests. On Devnet the real Core program is already deployed.
[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "tests/fixtures/mpl_core_program.so"
